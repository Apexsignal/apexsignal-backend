# appka (2026-09-18, uživatelovo přání: "tri kandidaty tri tikety kde je
# nejpravdepodobnejsi remiza") — jednou denně pošle appčinu vlastnímu
# Telegramu (ne odběratelům) přehled 3 zápasů s nejvyšší appky spočtenou
# pravděpodobností remízy. Čistě informativní, žádný edge/kurz appka
# nekontroluje (viz /admin/draw-picks-send).
#
# Vyžaduje repozitářový secret ADMIN_TASK_KEY (stejný jako u
# daily-tickets.yml).
name: Denní přehled remíz

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Poslat appce přehled top 3 remíz dne
        run: |
          curl -sf -X POST https://apexsignal-backend.onrender.com/admin/draw-picks-send \
            -H "X-Admin-Key: ${{ secrets.ADMIN_TASK_KEY }}"
