# Appka dřív neměla ŽÁDNÉ automatické spouštění denních tiketů — historie
# ukazovala nepravidelné časy vzniku (12:53, 22:00, 08:55...), což je
# vzorec ručního volání, ne cronu. Pro placený kanál (2 500 Kč/měsíc) je
# tohle kritická díra: zaplacený a spárovaný zákazník by nedostal nic, dokud
# by appka ručně nezavolala admin endpointy.
#
# 05:00 UTC = 7:00 v Praze v létě (CEST), 6:00 v zimě (CET) — appka tenhle
# roční posun o hodinu bere jako přijatelný, přesnost na minutu tu nehraje
# roli. Kroky jdou za sebou v jednom běhu, ne jako samostatné naplánované
# úlohy, ať appka nemusí řešit, jestli některý krok náhodou neběží dřív
# než ten, na kterém závisí.
#
# Veřejná transparentní stránka (TRANSPARENCY_USER_ID) je SAMOSTATNÝ účet,
# oddělený od placeného kanálu (DAILY_TICKETS_USER_ID) — má vlastní
# generovací krok níže (/admin/transparency-daily-tickets), appka na něj
# dřív žádný cron neměla zapojený, což byl skutečný důvod, proč stránka
# ukazovala starou/tenkou historii (ověřeno 2026-07-30).
#
# Vyžaduje repozitářový secret ADMIN_TASK_KEY (Settings → Secrets and
# variables → Actions → New repository secret) se stejnou hodnotou, jakou
# appka má na Renderu v proměnné ADMIN_TASK_KEY.
name: Denní tikety pro placený kanál

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}  # appka umožní i ruční spuštění z záložky Actions

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Vygenerovat dnešní tikety (kratky/stredni, okno 2 dny na 70%)
        run: |
          curl -sf -X POST https://apexsignal-backend.onrender.com/admin/daily-tickets \
            -H "X-Admin-Key: ${{ secrets.ADMIN_TASK_KEY }}"

      - name: Vygenerovat dnesni tikety na test3 (2x kratky, 2x stredni, sazka 1000 Kc)
        run: |
          curl -sf -X POST https://apexsignal-backend.onrender.com/admin/test3-daily-tickets \
            -H "X-Admin-Key: ${{ secrets.ADMIN_TASK_KEY }}"

      - name: Vygenerovat dnesni tikety na transparentni ucet (2x kratky, 1x stredni, sazka 2000 Kc)
        run: |
          curl -sf -X POST https://apexsignal-backend.onrender.com/admin/transparency-daily-tickets \
            -H "X-Admin-Key: ${{ secrets.ADMIN_TASK_KEY }}"

      - name: Vygenerovat dnesni tikety na d.voves@seznam.cz (2x kratky, 1x stredni, sazka 2000 Kc)
        run: |
          curl -sf -X POST https://apexsignal-backend.onrender.com/admin/dvoves-daily-tickets \
            -H "X-Admin-Key: ${{ secrets.ADMIN_TASK_KEY }}"

      - name: Upozornit na Telegram, ze dnesni tiket ceka na schvaleni
        # appka tenhle krok dřív posílala VŽDY, i když se tiket nevygeneroval
        # (uživatel 2026-08-27 nahlásil zprávu bez existujícího tiketu) —
        # teď appka nejdřív ověří přes /admin/client-tickets-preview, jestli
        # tam fakt něco je, a pošle jinou zprávu, když appka dnes nic nemá.
        run: |
          picks=$(curl -sf https://apexsignal-backend.onrender.com/admin/client-tickets-preview \
            -H "X-Admin-Key: ${{ secrets.ADMIN_TASK_KEY }}" | grep -o '"ticket_id"' | wc -l)
          if [ "$picks" -gt 0 ]; then
            msg="📋 Dnešní tiket je vygenerovaný a čeká na schválení. Zkontroluj a odešli na apexsignal.cz/admin-prodejci"
          else
            msg="⚠️ Dnešní tiket se nepodařilo vygenerovat (nenašel se kandidát nad práh jistoty) — dnes appka nemá co poslat."
          fi
          curl -sf -X POST https://apexsignal-backend.onrender.com/admin/alert \
            -H "X-Admin-Key: ${{ secrets.ADMIN_TASK_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"message\": \"$msg\"}"

      # Rozesílka klientům/prodejcům je od 2026-08-26 na uživatelovo výslovné
      # přání RUČNÍ — appka nejdřív ukáže dnešní tiket na /admin-prodejci,
      # uživatel ho tam schválí, a teprve to (ne tenhle cron) spustí
      # /admin/client-tickets-send. Backend to i vynucuje (viz kontrola
      # schválení v client_tickets_send), takže tenhle krok appka schválně
      # z automatiky odstranila, ne jen zakomentovala.

      - name: Odpojit a upozornit predplatitele, kterym doběhlo predplatne
        if: always()  # appka tohle chce pustit, i kdyz predchozi krok selze
        run: |
          curl -sf -X POST https://apexsignal-backend.onrender.com/admin/telegram-sync \
            -H "X-Admin-Key: ${{ secrets.ADMIN_TASK_KEY }}"

      # Appčin vlastní kanál (DAILY_TICKETS_USER_ID) si pending tikety
      # dosettluje sám (viz run_daily_tickets) — ale BĚŽNÉ účty appky
      # (kdokoli si sám generuje/ukládá tikety v appce) tohle neměly
      # vůbec, appka je zkusila vyhodnotit jen JEDNOU při uložení, kdy
      # zápas skoro nikdy neskončil. Nezávislé na předchozích krocích,
      # proto vždy.
      - name: Dosettlovat pending tikety napříč VŠEMI účty appky
        if: always()
        run: |
          curl -sf -X POST https://apexsignal-backend.onrender.com/admin/settle-all-pending \
            -H "X-Admin-Key: ${{ secrets.ADMIN_TASK_KEY }}"

      # Appka dřív neměla žádné upozornění na selhání denního cronu — jediný
      # způsob, jak se to appka dozvěděla, bylo si ručně všimnout v Actions
      # záložce. Když selže KTERÝKOLIV krok výše, appka pošle zprávu rovnou
      # na vlastní Telegram (backend má už uložený TELEGRAM_CHAT_ID/TOKEN,
      # workflow tak nepotřebuje žádný nový secret navíc).
      - name: Upozornit na Telegram, pokud něco výše selhalo
        if: failure()
        run: |
          curl -sf -X POST https://apexsignal-backend.onrender.com/admin/alert \
            -H "X-Admin-Key: ${{ secrets.ADMIN_TASK_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"message\": \"⚠️ Denní cron (daily-tickets.yml) dnes selhal. Zkontroluj GitHub Actions: https://github.com/Apexsignal/apexsignal-backend/actions/runs/${{ github.run_id }}\"}"
