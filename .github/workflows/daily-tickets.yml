# appka (2026-09-17, uživatelovo přání: "telegram kanál už neběží.. a
# střední tiket přeci už také není.. pojďme to změnit, aby appka hledala
# alespoň 3x denně vhodné kandidáty a neopakovala se") — appka tenhle
# workflow zjednodušila:
# - JEDEN generátor běh (DAILY_TICKETS_USER_ID, appka ho drží jako
#   "master" zdroj, i bez placených odběratelů) — appka to stejnou
#   kombinaci pak jen KOPÍRUJE na transparentní účet i na d.voves, místo
#   aby appka hledala nezávisle 2-3× a náhodně narážela na stejný
#   nejlepší tip vícekrát (to appku dřív stálo desítky "duplicitních"
#   tiketů při zpětné kontrole ROI).
# - Appka to zkouší 3× denně (6/12/18 UTC), ne jen jednou — appka na
#   tenký kandidátský pool už narazila mnohokrát; run_daily_tickets sám
#   hlídá "dnes už mám", takže vícenásobné spuštění nic nezdvojí, jen
#   appce dá víc šancí najít kandidáta, kdyby ráno nic nebylo.
# - appka smazala appčin vlastní test3 krok (bez odběratelů appka nemá
#   důvod ho dál generovat) a zmínky o "středním" tiketu (appka ho
#   dávno přestala nabízet, viz probability_model.py).
#
# Vyžaduje repozitářový secret ADMIN_TASK_KEY (Settings → Secrets and
# variables → Actions → New repository secret) se stejnou hodnotou, jakou
# appka má na Renderu v proměnné ADMIN_TASK_KEY.
name: Denní tikety (master generátor + kopie)

on:
  schedule:
    - cron: "0 6,12,18 * * *"
  workflow_dispatch: {}  # appka umožní i ruční spuštění z záložky Actions

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      # 2026-09-02: appce tenhle krok jednou spadl na HTTP timeoutu po 4,5
      # minutách (Render dočasně přetížený, ne skutečná chyba appky) —
      # appka to tenkrát musela appce (uživateli) hlásit jako selhání a
      # čekat na ruční opakování. Teď appka sama zkusí ještě jednou po
      # 3 minutách, dřív než appka cokoliv appce nahlásí jako selhání.
      - name: Vygenerovat dnešní tiket (master, kratky) — appka pošle i na vlastní Telegram
        run: |
          for pokus in 1 2; do
            if curl -sf -X POST https://apexsignal-backend.onrender.com/admin/daily-tickets \
              -H "X-Admin-Key: ${{ secrets.ADMIN_TASK_KEY }}"; then
              exit 0
            fi
            echo "Pokus $pokus selhal."
            if [ "$pokus" -eq 1 ]; then
              echo "appka počká 3 minuty a zkusí to znovu..."
              sleep 180
            fi
          done
          exit 1

      - name: Zkopirovat dnesni tiket na transparentni ucet (2000 Kc)
        run: |
          curl -sf -X POST https://apexsignal-backend.onrender.com/admin/copy-daily-tickets-to-user \
            -H "X-Admin-Key: ${{ secrets.ADMIN_TASK_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"target_user_id": 2, "stake_amount": 2000}'

      - name: Zkopirovat dnesni tiket na d.voves@seznam.cz (2000 Kc)
        run: |
          curl -sf -X POST https://apexsignal-backend.onrender.com/admin/copy-daily-tickets-to-user \
            -H "X-Admin-Key: ${{ secrets.ADMIN_TASK_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"target_user_id": 60, "stake_amount": 2000}'

      - name: Upozornit na Telegram, ze dnesni tiket ceka na schvaleni
        # appka tenhle krok dřív posílala VŽDY, i když se tiket nevygeneroval
        # (uživatel 2026-08-27 nahlásil zprávu bez existujícího tiketu) —
        # teď appka nejdřív ověří přes /admin/client-tickets-preview, jestli
        # tam fakt něco je, a pošle jinou zprávu, když appka dnes nic nemá.
        #
        # 2026-08-28 — appka doplnila kontrolu already_sent: cron může
        # doběhnout ve stejný den, kdy byl tiket už dřív ručně schválený a
        # odeslaný (např. ranní ruční test), a bez týhle kontroly appka
        # posílala zavádějící "čeká na schválení" i na už vyřízený tiket.
        run: |
          preview=$(curl -sf https://apexsignal-backend.onrender.com/admin/client-tickets-preview \
            -H "X-Admin-Key: ${{ secrets.ADMIN_TASK_KEY }}")
          picks=$(echo "$preview" | jq '[.picks[] | select(.already_sent != true)] | length')
          if [ "$picks" -gt 0 ]; then
            msg="📋 Dnešní tiket je vygenerovaný a čeká na schválení. Zkontroluj a odešli na apexsignal.cz/admin-prodejci"
            curl -sf -X POST https://apexsignal-backend.onrender.com/admin/alert \
              -H "X-Admin-Key: ${{ secrets.ADMIN_TASK_KEY }}" \
              -H "Content-Type: application/json" \
              -d "{\"message\": \"$msg\"}"
          elif [ "$(echo "$preview" | jq '.picks | length')" -eq 0 ]; then
            msg="⚠️ Dnešní tiket se nepodařilo vygenerovat (nenašel se kandidát nad práh jistoty) — dnes appka nemá co poslat."
            curl -sf -X POST https://apexsignal-backend.onrender.com/admin/alert \
              -H "X-Admin-Key: ${{ secrets.ADMIN_TASK_KEY }}" \
              -H "Content-Type: application/json" \
              -d "{\"message\": \"$msg\"}"
          fi
          # else: appka dnešní tiket už má schválený a odeslaný — appka nic
          # dalšího neposílá, ať zbytečně neopakuje starou zprávu.

      # Rozesílka klientům/prodejcům je od 2026-08-26 na uživatelovo výslovné
      # přání RUČNÍ — appka nejdřív ukáže dnešní tiket na /admin-prodejci,
      # uživatel ho tam schválí, a teprve to (ne tenhle cron) spustí
      # /admin/client-tickets-send. Backend to i vynucuje (viz kontrola
      # schválení v client_tickets_send), takže tenhle krok appka schválně
      # z automatiky odstranila, ne jen zakomentovala.

      - name: Odpojit a upozornit predplatitele, kterym doběhlo predplatne
        if: always()  # appka tohle chce pustit, i kdyz predchozi krok selze
        run: |
          curl -sf -X POST https://apexsignal-backend.onrender.com/admin/telegram-sync \
            -H "X-Admin-Key: ${{ secrets.ADMIN_TASK_KEY }}"

      # Appčin vlastní kanál (DAILY_TICKETS_USER_ID) si pending tikety
      # dosettluje sám (viz run_daily_tickets) — ale BĚŽNÉ účty appky
      # (kdokoli si sám generuje/ukládá tikety v appce) tohle neměly
      # vůbec, appka je zkusila vyhodnotit jen JEDNOU při uložení, kdy
      # zápas skoro nikdy neskončil. Nezávislé na předchozích krocích,
      # proto vždy.
      - name: Dosettlovat pending tikety napříč VŠEMI účty appky
        if: always()
        run: |
          curl -sf -X POST https://apexsignal-backend.onrender.com/admin/settle-all-pending \
            -H "X-Admin-Key: ${{ secrets.ADMIN_TASK_KEY }}"

      # Appka dřív neměla žádné upozornění na selhání denního cronu — jediný
      # způsob, jak se to appka dozvěděla, bylo si ručně všimnout v Actions
      # záložce. Když selže KTERÝKOLIV krok výše, appka pošle zprávu rovnou
      # na vlastní Telegram (backend má už uložený TELEGRAM_CHAT_ID/TOKEN,
      # workflow tak nepotřebuje žádný nový secret navíc).
      - name: Upozornit na Telegram, pokud něco výše selhalo
        if: failure()
        run: |
          curl -sf -X POST https://apexsignal-backend.onrender.com/admin/alert \
            -H "X-Admin-Key: ${{ secrets.ADMIN_TASK_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"message\": \"⚠️ Denní cron (daily-tickets.yml) dnes selhal. Zkontroluj GitHub Actions: https://github.com/Apexsignal/apexsignal-backend/actions/runs/${{ github.run_id }}\"}"
